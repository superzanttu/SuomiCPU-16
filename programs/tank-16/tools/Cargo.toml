[package]
name = "tank16-tools"
version = "0.1.0"
edition = "2024"

[lib]
path = "lib.rs"

[dependencies]
image = { version = "0.24.9", default-features = false, features = ["png"] }
imageproc = { version = "0.23.1", default-features = false }
macroquad = { version = "0.4.16", features = ["audio"] }
serde_json = "1"
suomicpu16 = { path = "../../.." }

[[bin]]
name = "sc16mapedit"
path = "sc16mapedit.rs"

[[bin]]
name = "sc16maps"
path = "sc16maps.rs"

[[bin]]
name = "sc16objects"
path = "sc16objects.rs"

[[bin]]
name = "sc16sprites"
path = "sc16sprites.rs"

[[bin]]
name = "sc16tank"
path = "sc16tank.rs"

[[test]]
name = "map_cli"
path = "tests/map_cli.rs"
