[package]
name = "suomicpu16"
version = "0.1.0"
edition = "2024"

[dependencies]
gif = "0.13"
image = { version = "0.24.9", default-features = false, features = ["gif", "png"] }
imageproc = { version = "0.23.1", default-features = false }
macroquad = { version = "0.4.16", features = ["audio"] }
memmap2 = "0.9"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.28"
socket2 = "0.6"
