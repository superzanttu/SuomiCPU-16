[package]
name = "suomicpu16"
version = "0.2.0"
edition = "2024"

[workspace]
members = ["programs/tank-16/tools"]
default-members = [".", "programs/tank-16/tools"]
resolver = "3"

[dependencies]
gif = "0.13"
image = { version = "0.24.9", default-features = false, features = ["gif", "png"] }
imageproc = { version = "0.23.1", default-features = false }
macroquad = { version = "0.4.16", features = ["audio"] }
memmap2 = "0.9"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
minifb = "0.28"
socket2 = "0.6"

[[bin]]
name = "sc16asm"
path = "src/tools/sc16asm.rs"

[[bin]]
name = "sc16build"
path = "src/tools/sc16build.rs"

[[bin]]
name = "sc16gallery"
path = "src/tools/sc16gallery.rs"

[[bin]]
name = "kiuas16-run"
path = "src/tools/kiuas16_run.rs"
