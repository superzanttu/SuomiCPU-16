[package]
name = "suomicpu16"
version = "0.1.0"
edition = "2024"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "suomicpu16"
path = "rust/src/main.rs"

[[bin]]
name = "sc16asm"
path = "rust/src/bin/sc16asm.rs"

[[bin]]
name = "sc16build"
path = "rust/src/bin/sc16build.rs"

[[bin]]
name = "sc16maps"
path = "rust/src/bin/sc16maps.rs"

[dependencies]
macroquad = { version = "0.4.16", features = ["audio"] }
memmap2 = "0.9"
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
socket2 = "0.6"
